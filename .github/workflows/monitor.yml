name: News Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Run monitor
        env:
          DISCORD_WEBHOOK_REALESTATE: ${{ secrets.DISCORD_WEBHOOK_REALESTATE }}
          DISCORD_WEBHOOK_NEWS: ${{ secrets.DISCORD_WEBHOOK_NEWS }}
          DISCORD_WEBHOOK_XSPORTS: ${{ secrets.DISCORD_WEBHOOK_XSPORTS }}
          DISCORD_WEBHOOK_XDEALS: ${{ secrets.DISCORD_WEBHOOK_XDEALS }}
          DISCORD_WEBHOOK_XCULTURE: ${{ secrets.DISCORD_WEBHOOK_XCULTURE }}
        run: python3 monitor.py

      - name: Persist seen.json
        run: |
          git config user.name "news-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update seen state [skip ci]"
          git pull --rebase origin main
          git push
